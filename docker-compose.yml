services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  sapl-pdp:
    image: ghcr.io/heutelbeck/sapl-node:4.1.2
    # SECURITY INVARIANT: when SAPL Node runs without auth (IO_SAPL_NODE_ALLOWNOAUTH=true,
    # demo / dev only), it MUST be bound to loopback only. The "127.0.0.1:..." prefix
    # publishes the port to the host's loopback interface, not to 0.0.0.0. Otherwise an
    # unauthenticated PDP becomes reachable from any host that can reach the docker host
    # (LAN, container overlay, dev laptop on a coffee-shop wifi). The NestJS client
    # enforces the same invariant on its side: HTTP / plaintext-RSocket only to loopback
    # hosts. Production deployments MUST configure auth (api-key, basic, or oauth2) AND
    # TLS, after which the bind can widen.
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:7000:7000"
    volumes:
      - ./policies:/pdp/data:ro
    environment:
      - SERVER_SSL_ENABLED=false
      - SERVER_PORT=8443
      - SERVER_ADDRESS=0.0.0.0
      - JAVA_TOOL_OPTIONS=-XX:MaxDirectMemorySize=256M
      - IO_SAPL_NODE_ALLOWNOAUTH=true
      - IO_SAPL_PDP_EMBEDDED_PDPCONFIGTYPE=DIRECTORY
      - IO_SAPL_PDP_EMBEDDED_POLICIESPATH=/pdp/data
      - IO_SAPL_PDP_EMBEDDED_PRINTTEXTREPORT=true
    restart: unless-stopped
